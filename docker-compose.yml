version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis-local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      # เก็บข้อมูลลงเครื่องจริง ข้อมูลไม่หายเมื่อ Restart
      - redis_data:/data
      # (Option) ถ้ามีไฟล์ redis.conf สามารถ Mount เข้าไปได้
      # - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis-server /usr/local/etc/redis/redis.conf

volumes:
  redis_data: